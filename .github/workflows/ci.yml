name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the pipeline only needs to read the repository.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test · build · audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        # The build must succeed without any real secrets. The chat route
        # creates its Anthropic client lazily, so no key is needed here.
        run: npm run build

      - name: Audit production dependencies
        # Fails the build on high/critical vulnerabilities in runtime deps.
        # Dev-only advisories are covered by Dependabot, not this gate.
        run: npm audit --omit=dev --audit-level=high
